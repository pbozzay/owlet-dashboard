name: Release and Deploy

# Pushing a v*.*.* tag runs the tests, publishes the image to Docker Hub
# (versioned + latest; skipped gracefully until the DOCKER_PASSWORD secret is
# set), builds the Windows desktop installer, and cuts a GitHub Release with
# the installer attached and Unraid update instructions.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: pbozzay
  IMAGE_NAME: pbozzay/owlet-dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Check release versions
      run: |
        python - <<'PYTHON'
        import json, os, pathlib, tomllib
        version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
        assert json.loads(pathlib.Path('desktop/src-tauri/tauri.conf.json').read_text())['version'] == version
        assert tomllib.loads(pathlib.Path('desktop/src-tauri/Cargo.toml').read_text())['package']['version'] == version
        assert pathlib.Path(f'docs/releases/v{version}.md').is_file()
        if os.environ['GITHUB_REF_TYPE'] == 'tag':
            assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
        PYTHON
    - name: Install dependencies
      run: pip install -e ".[dev]"
    - name: Run tests
      run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      # secrets aren't allowed in job-level `if`, so each step gates on this
      HAS_DOCKER_SECRET: ${{ secrets.DOCKER_PASSWORD != '' && 'true' || 'false' }}
    steps:
    - name: Checkout code
      if: env.HAS_DOCKER_SECRET == 'true'
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      if: env.HAS_DOCKER_SECRET == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: env.HAS_DOCKER_SECRET == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Read package version
      if: env.HAS_DOCKER_SECRET == 'true'
      id: version
      run: python -c "import tomllib; print('version=' + tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      if: env.HAS_DOCKER_SECRET == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          ${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false
        sbom: false

    - name: Note skip
      if: env.HAS_DOCKER_SECRET != 'true'
      run: echo "DOCKER_PASSWORD secret not set — skipping Docker Hub publish (GHCR still publishes from main)."

  desktop:
    needs: test
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install server dependencies + PyInstaller
      run: |
        python -m venv .venv
        .venv\Scripts\python -m pip install -e . pyinstaller

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: desktop/src-tauri

    - name: Install Tauri CLI
      run: npm install -g "@tauri-apps/cli@^2"

    - name: Freeze server sidecar
      run: .\desktop\build-sidecar.ps1

    - name: Generate icons
      working-directory: desktop/src-tauri
      run: tauri icon ..\..\app\static\icon-512.png

    - name: Build desktop app
      working-directory: desktop/src-tauri
      run: tauri build
      env:
        # Signs the installer so the in-app updater can verify it. The public
        # half is baked into tauri.conf.json; without these, no .sig is produced.
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    - name: Read package version
      id: version
      shell: bash
      run: python -c "import tomllib; print('version=' + tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" >> $GITHUB_OUTPUT

    - name: Collect installer + update manifest
      shell: bash
      run: |
        VER="${{ steps.version.outputs.version }}"
        export OUT="Owlet-Dashboard-${VER}-windows-setup.exe"
        mkdir -p dist-installer
        SETUP=$(ls "desktop/src-tauri/target/release/bundle/nsis/"*-setup.exe | head -1)
        export SIGFILE=$(ls "desktop/src-tauri/target/release/bundle/nsis/"*-setup.exe.sig | head -1)
        cp "$SETUP" "dist-installer/$OUT"
        # latest.json is what the app polls; the endpoint resolves to the newest
        # release's copy, so an older app sees the new version + its signature.
        VER="$VER" python desktop/ci/make_latest_json.py > dist-installer/latest.json
        echo "--- latest.json ---"; cat dist-installer/latest.json

    - uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: dist-installer/*
        if-no-files-found: error

  release:
    needs: [test, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Read package version
      id: version
      run: python -c "import tomllib; print('version=' + tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" >> $GITHUB_OUTPUT

    - uses: actions/download-artifact@v4
      with:
        name: windows-installer
        path: dist-installer

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.version.outputs.version }}
        files: |
          dist-installer/*.exe
          dist-installer/latest.json
        tag_name: v${{ steps.version.outputs.version }}
        target_commitish: ${{ github.sha }}
        body_path: docs/releases/v${{ steps.version.outputs.version }}.md
        draft: false
        prerelease: false
